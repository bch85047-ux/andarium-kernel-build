name: Andarium Kernel Build

on:
  workflow_dispatch:
    inputs:
      compress_system_img:
        description: 'Compress system.img with erofs lz4'
        required: true
        default: true
        type: boolean
      build_ipa:
        description: 'Repack final IPA'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build-kernel:
    name: Build UML Kernel (x86_64, fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm bc kmod cpio flex bison libssl-dev libelf-dev dwarves pahole git wget erofs-utils e2fsprogs gdisk qemu-user-static binfmt-support zstd pigz python3

      - name: Clone Linux kernel source (mainline)
        run: |
          git clone --depth=1 -b v6.18 https://github.com/torvalds/linux.git linux-6.18
          cd linux-6.18 && echo "Kernel: $(git log -1 --oneline)"

      - name: Generate optimized kernel config (UML x86_64)
        run: |
          cd linux-6.18
          make ARCH=um defconfig
          ./scripts/config --enable PREEMPT_VOLUNTARY
          ./scripts/config --set-str CONFIG_HZ 250
          ./scripts/config --enable NO_HZ_FULL
          ./scripts/config --enable EROFS_FS
          ./scripts/config --enable EROFS_FS_COMPRESSION
          ./scripts/config --enable EROFS_FS_LZ4
          ./scripts/config --enable EROFS_FS_LZ4HC
          ./scripts/config --disable DEBUG_KERNEL
          ./scripts/config --disable MODULES
          make ARCH=um olddefconfig

      - name: Build UML kernel
        run: |
          cd linux-6.18
          make ARCH=um -j$(nproc) CC=clang 2>&1 | tee build.log
          ls -lh linux
          file linux

      - uses: actions/upload-artifact@v4
        with:
          name: uml-kernel-optimized
          path: linux-6.18/linux
          retention-days: 30

  compress-system-img:
    name: Compress system.img (erofs lz4)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    if: ${{ inputs.compress_system_img }}
    steps:
      - uses: actions/checkout@v4

      - name: Install erofs tools
        run: sudo apt-get update && sudo apt-get install -y erofs-utils e2fsprogs gdisk python3 zstd

      - name: Download system.img chunks from Release
        run: |
          mkdir -p chunks
          BASE="https://github.com/bch85047-ux/andarium-kernel-build/releases/download/v1.0-system-img"
          for suffix in aa ab ac ad ae af ag ah ai aj ak al am an ao ap aq ar as at au; do
            wget -q --show-progress -O "chunks/system.img.$suffix" "$BASE/system.img.$suffix"
          done
          cat chunks/system.img.* > system.img
          ls -lh system.img
          stat -c%s system.img
          test "$(stat -c%s system.img)" = "1056526336" && echo "SIZE OK" || echo "SIZE MISMATCH"

      - name: Compress system.img partitions (lz4)
        run: |
          python3 scripts/compress_system_img.py system.img system.img.compressed lz4
          sgdisk -p system.img.compressed

      - uses: actions/upload-artifact@v4
        with:
          name: system-img-compressed
          path: system.img.compressed
          retention-days: 30

  repack-ipa:
    name: Repack Andarium IPA
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [compress-system-img]
    if: ${{ inputs.build_ipa }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3

      - uses: actions/download-artifact@v4
        with:
          name: system-img-compressed
          path: img-out

      - name: Download original IPA chunks from Release
        run: |
          mkdir -p ipachunks
          BASE="https://github.com/bch85047-ux/andarium-kernel-build/releases/download/v1.0-system-img"
          for suffix in aa ab ac ad ae af ag ah ai aj ak al am an ao ap aq ar as at au av; do
            wget -q --show-progress -O "ipachunks/ipa.$suffix" "$BASE/Andarium-1.0-15.ipa.$suffix"
          done
          cat ipachunks/ipa.* > Andarium-1.0-15.ipa
          ls -lh Andarium-1.0-15.ipa
          unzip -l Andarium-1.0-15.ipa | tail -3

      - name: Repack IPA with compressed system.img
        run: |
          python3 scripts/repack_ipa.py Andarium-1.0-15.ipa Andarium-optimized-lz4.ipa \
            kernel-command-line-optimized.txt img-out/system.img.compressed

      - uses: actions/upload-artifact@v4
        with:
          name: andarium-optimized-ipa
          path: Andarium-optimized-lz4.ipa
          retention-days: 30
