name: Rebuild system.img with perf tweaks

on:
  workflow_dispatch:
    inputs:
      tweak_profile:
        description: 'Performance profile'
        required: true
        default: 'performance'
        type: choice
        options:
          - performance
          - balanced

permissions:
  contents: read
  actions: write

jobs:
  rebuild-system:
    name: Rebuild system.img (perf tweaks)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs gdisk python3 zstd fuse3 libfuse3-dev
          curl -sL -o partition-layout.json "https://raw.githubusercontent.com/bch85047-ux/andarium-kernel-build/main/partition-layout.json"
          head -c 100 partition-layout.json
          echo
          echo "=== build erofs-utils from source (for erofsfuse) ==="
          cd /tmp
          git clone --depth=1 https://gitlab.com/erofs/erofs-utils.git 2>&1 | tail -2 || true
          cd erofs-utils
          ./setup.sh 2>&1 | tail -5 || true
          mkdir -p build && cd build
          ../configure --prefix=/usr/local 2>&1 | tail -3 || true
          make -j$(nproc) 2>&1 | tail -3 || true
          make install 2>&1 | tail -3 || true
          ls -la /usr/local/bin/erofsfuse /usr/bin/erofsfuse 2>/dev/null || echo "erofsfuse build failed"
          cd /tmp

      - name: Download original system.img
        run: |
          mkdir -p chunks
          BASE="https://github.com/bch85047-ux/andarium-kernel-build/releases/download/v1.0-system-img"
          for suffix in aa ab ac ad ae af ag ah ai aj ak al am an ao ap aq ar as at au; do
            wget -q -O "chunks/system.img.$suffix" "$BASE/system.img.$suffix"
          done
          cat chunks/system.img.* > system.img
          stat -c%s system.img

      - name: Step split
        run: |
          echo '' | base64 -d > step_split.py
          python3 step_split.py

      - name: Step mount
        run: |
          echo '' | base64 -d > step_mount.py
          python3 step_mount.py

      - name: Step tweak
        run: |
          echo '' | base64 -d > step_tweak.py
          python3 step_tweak.py

      - name: Step rebuild
        run: |
          echo '' | base64 -d > step_rebuild.py
          python3 step_rebuild.py

      - name: Step assemble
        run: |
          echo '' | base64 -d > step_assemble.py
          python3 step_assemble.py

      - name: Step verify
        run: |
          echo '' | base64 -d > step_verify.py
          python3 step_verify.py

      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-system-perf
          path: |
            system.img.rebuilt
            partition-layout.rebuilt.json
          retention-days: 30
