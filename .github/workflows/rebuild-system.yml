name: Rebuild system.img with perf tweaks

on:
  workflow_dispatch:
    inputs:
      tweak_profile:
        description: 'Performance profile'
        required: true
        default: 'performance'
        type: choice
        options:
          - performance
          - balanced

permissions:
  contents: read
  actions: write

jobs:
  rebuild-system:
    name: Rebuild system.img (perf tweaks)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Build erofs-utils 1.9.4 with FUSE
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config liblz4-dev libzstd-dev zlib1g-dev libselinux1-dev uuid-dev libext2fs-dev fuse3 libfuse3-dev
          cd /tmp
          git clone --depth=1 https://github.com/erofs/erofs-utils.git
          cd erofs-utils
          ./autogen.sh
          ./configure --prefix=/usr/local --enable-fuse
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          find /usr/local -name 'erofsfuse' 2>/dev/null
          exit 0

      - name: Download original system.img
        run: |
          mkdir -p chunks
          BASE="https://github.com/bch85047-ux/andarium-kernel-build/releases/download/v1.0-system-img"
          for suffix in aa ab ac ad ae af ag ah ai aj ak al am an ao ap aq ar as at au; do
            wget -q -O "chunks/system.img.$suffix" "$BASE/system.img.$suffix"
          done
          cat chunks/system.img.* > system.img
          stat -c%s system.img
          curl -sL -o partition-layout.json "https://raw.githubusercontent.com/bch85047-ux/andarium-kernel-build/main/partition-layout.json"
          ls -la partition-layout.json

      - name: Step split
        run: |
          echo '' | base64 -d > step_split.py
          sudo python3 step_split.py

      - name: Step mount
        run: |
          echo '' | base64 -d > step_mount.py
          sudo python3 step_mount.py

      - name: Step tweak
        run: |
          echo '' | base64 -d > step_tweak.py
          sudo python3 step_tweak.py

      - name: Step rebuild
        run: |
          echo '' | base64 -d > step_rebuild.py
          sudo python3 step_rebuild.py

      - name: Step assemble
        run: |
          echo '' | base64 -d > step_assemble.py
          sudo python3 step_assemble.py

      - name: Step verify
        run: |
          echo '' | base64 -d > step_verify.py
          sudo python3 step_verify.py

      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-system-perf
          path: |
            system.img.rebuilt
            partition-layout.rebuilt.json
          retention-days: 30
